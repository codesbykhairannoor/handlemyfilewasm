[package]
name = "pdftodocx"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "High-precision PDF to DOCX converter engine in Pure Rust and WebAssembly"
license = "MIT"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pdftodocx"
path = "src/main.rs"

[dependencies]
# PDF Parsing & Low-Level Decompression
lopdf = "0.34"
flate2 = "1.0"
crc32fast = "1.4"

# OOXML Generation & ZIP Packaging
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Data Modeling & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Document Layout Analysis (DLA) Structures
rstar = "0.12"      # 2D R*-Tree Spatial Indexing
petgraph = "0.6"    # Planar Graph Intersection for Table Structure Recognition

# WebAssembly Bindings
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
